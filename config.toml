# Humanoid robotics profile. Replace these interests with your own.
timezone = "Asia/Shanghai"
state_dir = ".state"
output_dir = "output"
compact_summaries = true

[arxiv]
# Category filter only: all fetched papers go through Jev; no keyword prefilter.
categories = ["cs.RO"]
# "api": rolling, paginated window for recovery after missed runs.
# "rss": latest announcement only; no historical catch-up.
source = "latest"
lookback_days = 7
page_size = 200
# Fail visibly rather than silently truncating the candidate pool.
max_candidates = 10000
request_interval_seconds = 3.1
include_cross_lists = true

[jev]
backend = "typesafe" # or "openrouter" with OPENROUTER_API_KEY
model = "jev-1.14.0"
# For OpenRouter: endpoint = "https://openrouter.ai/api/alpha/decisions"
# model = "typesafe/jev-1.14"
endpoint = "https://api.typesafe.ai/v1/systemone"
concurrency = 8
requests_per_minute = 600
timeout_seconds = 60
attempts = 3

[selection]
top_k = 10
min_score = 0.60
exclude_threshold = 0.85
combine = "max" # or "noisy_or"; composed scores are ranking signals

[[interests]]
id = "humanoid"
label = "人形机器人与全身控制"
text = "The paper develops or evaluates whole-body behavior, control, locomotion, or loco-manipulation of humanoid or bipedal robots."
weight = 1.0

[[interests]]
id = "tracking"
label = "动作追踪与模仿"
text = "The paper proposes motion tracking, imitation, retargeting, transition synthesis, or teleoperation specifically for humanoid or bipedal robot control."
weight = 1.0

[[interests]]
id = "motion_methods"
label = "相关动作感知与规划方法"
text = "The paper proposes a method for sensing articulated human body motion or generating and planning physically feasible articulated human or humanoid motion."
weight = 0.75

[[exclusions]]
id = "unrelated"
label = "无关应用"
text = "The primary topic is aerial flight, wheeled driving, surgical manipulation, underwater robotics, or exoskeleton assistance rather than humanoid robot control or human motion sensing."

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
language = "简体中文"
concurrency = 3
requests_per_minute = 60
max_tokens = 1800
timeout_seconds = 120
attempts = 3
disable_thinking = true # Set false for a provider that does not accept this field.

[email]
host = "smtp.qq.com" # QQ Mail example; replace for another SMTP provider.
port = 465
security = "ssl" # "starttls" usually uses port 587
sender_name = "arXiv Paper Digest"
subject_prefix = "arXiv 论文日报"
# Prefer EMAIL_TO (GitHub Secret) for private addresses.
recipients = []
send_empty = false
timeout_seconds = 45

[retention]
cache_days = 30
# Sent-paper and reviewed-paper history is kept indefinitely for deduplication.

[enrichment]
enabled = true
timeout_seconds = 45
max_pdf_mb = 25
