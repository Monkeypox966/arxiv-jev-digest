# Humanoid robotics profile. Replace these interests with your own.
timezone = "Asia/Shanghai"
state_dir = ".state"
output_dir = "output"
compact_summaries = true

[arxiv]
# Category filter only: all fetched papers go through Jev; no keyword prefilter.
categories = ["cs.RO"]
# Daily discovery uses /new, including new, cross-listed and replacement papers.
# Explicit recovery uses an API submission window; /new has no historical archive.
source = "new"
lookback_days = 7
page_size = 200
# Fail visibly rather than silently truncating the candidate pool.
max_candidates = 10000
request_interval_seconds = 3.1
include_cross_lists = true
catch_up = false # /new only contains the current batch; recover missed days explicitly.

[jev]
backend = "typesafe" # or "openrouter" with OPENROUTER_API_KEY
# Other System One-compatible services: choose a backend label and set model + endpoint.
# api_key_env = "DECISION_API_KEY" # default for backends other than typesafe/openrouter
model = "jev-1.14.0"
# For OpenRouter: endpoint = "https://openrouter.ai/api/alpha/decisions"
# model = "typesafe/jev-1.14"
endpoint = "https://api.typesafe.ai/v1/systemone"
concurrency = 8
requests_per_minute = 600
timeout_seconds = 60
attempts = 3

[selection]
top_k = 15 # Total across all three sections; never fill below the relevance/quality gates.
min_score = 0.60
exclude_threshold = 0.85
combine = "max" # or "noisy_or"; composed scores are ranking signals

[ranking]
# Relevance gate first; verified institution filter and ranking before Top K.
enabled = true
institution_weight = 0.40 # final = 0.60 * relevance + 0.40 * institution
min_institution_score = 0.80 # Keep verified S/A tiers; filter B, not missing evidence.
unknown_policy = "keep" # "exclude" for strict filtering when metadata is unavailable
unlisted_policy = "keep" # absence from a preference list is not a low-quality verdict
neutral_score = 0.60 # Neutral baseline when institution strength cannot be verified.
assess_unlisted = true # ROR identity + official website evidence + model-assisted assessment.
learn_institutions = true # Persist confirmed aliases and new institution scores in the state branch.
assessment_cache_days = 30
assessment_retry_hours = 168 # Recheck insufficient evidence after 7 days.
assessment_min_confidence = 0.80
assessment_limit_per_run = 12 # Uncached institutions; model retries also count toward API budgets.
assessment_retry_limit_per_run = 20 # Reconsider unsent candidates with deferred assessments.
# Defaults: src/arxiv_digest/data/institutions.json; user preference, not a league table.
# [[ranking.institutions]] entries replace the bundled list (see docs/ranking.md).

[[interests]]
id = "humanoid"
label = "人形移动与全身行为"
text = "The paper's contribution directly concerns locomotion, balance, whole-body coordination, or loco-manipulation of humanoid or bipedal robots. A platform name such as Unitree G1 or H1 can establish the humanoid embodiment, but the title or abstract must also connect the contribution to one of these tasks. Generic arm manipulation, video prediction, or a passing mention of a humanoid platform alone is insufficient. Judge the supplied title and abstract, not potential future applications."
weight = 1.0

[[interests]]
id = "whole_body_control"
label = "全身控制"
text = "The paper proposes or evaluates whole-body control (whole body control, WBC) coordinating a humanoid robot's floating base, limbs, or multiple contacts. Include model-based and learned controllers. Unitree G1 is a humanoid platform, but its name alone or manipulation of only its arm without whole-body coordination is insufficient. Require evidence of whole-body control in the supplied title or abstract, rather than inferring it from a robot brand or possible future use."
weight = 1.0

# G1 identifies a platform, not a separate relevance pass. Each question still
# requires a contribution to the stated research task; other humanoids qualify too.
[[interests]]
id = "compliance"
label = "柔顺与力交互控制"
text = "The paper proposes or evaluates compliant, impedance, admittance, stiffness-modulated, or force-position control on humanoid or bipedal robots, including Unitree G1. Upper-body or end-effector compliance on humanoid platforms qualifies. Require an explicit mechanism for responding to forces or contact or regulating compliance; generic safe or robust manipulation is insufficient. Methods demonstrated on robot arms alone do not qualify unless the title or abstract also establishes humanoid application."
weight = 1.0

[[interests]]
id = "tracking"
label = "动作追踪与模仿"
text = "The paper contributes reference-motion tracking, motion imitation, motion retargeting, motion transitions, or human-to-robot teleoperation for humanoid or bipedal control, including Unitree G1. Include mimic, mimicry, motion mimicking, and whole-body mimicking methods when the title or abstract establishes this humanoid or bipedal control contribution. Require this control connection in the supplied title or abstract. The keyword mimic alone, medical MIMIC datasets, object tracking, generic imitation learning on robot arms, and citations of humanoid tracking work are insufficient. A humanoid platform's name alone does not establish a motion-tracking contribution."
weight = 1.0

[[interests]]
id = "motion_methods"
label = "物理运动与跨本体表征"
text = "The paper contributes physically based articulated human or humanoid motion synthesis, motion planning, motion priors, or cross-embodiment human-to-humanoid motion or action representations used for policy control. Include physically simulated humanoid character controllers and planners. Require a body-motion or human-to-humanoid action-transfer connection in the title or abstract. Generic video generation, prediction conditioned on existing control tokens, generic reinforcement learning, or generic arm-policy learning without this connection is insufficient."
weight = 0.75

[[interests]]
id = "human_motion_sensing"
label = "人体运动感知"
text = "The paper estimates articulated human body motion, joint poses, or relative body-segment orientations from sensors such as IMUs or cameras. Require a contribution to human body kinematics or motion capture. Object tracking, physiology, isolated image features, and merely recording videos with a humanoid robot's camera do not qualify."
weight = 0.75

[[exclusions]]
id = "unrelated"
label = "无关应用"
text = "The primary topic is aerial flight, wheeled driving, surgical manipulation, underwater robotics, or exoskeleton assistance rather than humanoid robot control or human motion sensing."

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
language = "简体中文"
concurrency = 3
requests_per_minute = 60
max_tokens = 1800
timeout_seconds = 120
attempts = 3
disable_thinking = true # Set false for a provider that does not accept this field.

[email]
host = "smtp.qq.com" # QQ Mail example; replace for another SMTP provider.
port = 465
security = "ssl" # "starttls" usually uses port 587
sender_name = "arXiv Paper Digest"
subject_prefix = "cs.RO 人形机器人日报"
# Prefer EMAIL_TO (GitHub Secret) for private addresses.
recipients = []
send_empty = true # Send a status digest even when no new matching papers are available.
timeout_seconds = 45

[retention]
cache_days = 30
# Sent-paper and reviewed-paper history is kept indefinitely for deduplication.

[enrichment]
enabled = true
timeout_seconds = 45
max_pdf_mb = 25
max_pdf_pages = 40 # Scan body links beyond the header; stop at References.
follow_project_page = true # One confirmed project page, only to fill missing affiliations.
incomplete_cache_hours = 24
retry_missing_affiliations = true
retry_attempts = 3
retry_limit_per_run = 20

[budget]
# Per run, including HTTP retries. Tokens without provider usage use conservative estimates.
max_jev_calls = 10000
max_deepseek_calls = 200
max_input_tokens = 2000000
max_output_tokens = 300000

[notifications]
# Scheduled/send failures can notify the configured recipients; previews never send mail.
email_on_failure = true
