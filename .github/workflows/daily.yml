name: Daily arXiv Digest
run-name: ${{ inputs.scheduler_id && format('Daily arXiv Digest · {0}', inputs.scheduler_id) || 'Daily arXiv Digest' }}

on:
  schedule:
    # Hourly backup for the independent server: 10:00–23:00 Asia/Shanghai.
    # Keep --daily-after and deploy/ in sync when changing the local time.
    - cron: '0 2-15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview never emails; daily checks today's delivery; send forces a normal run.
        type: choice
        options: [preview, daily, send, inspect, institutions, delivery_test, recover_preview, recover_send, reset_checkpoints, resolve_sent, resolve_retry]
        default: preview
      scheduler_id:
        description: Optional external scheduler correlation ID; does not change delivery mode.
        type: string
        required: false
      delivery_id:
        description: Only for resolve modes; check the recipient inbox first.
        type: string
        required: false
      paper_ids:
        description: Only for inspect; 1-5 arXiv IDs separated by spaces, never sends email.
        type: string
        required: false
      recovery_days:
        description: Only for recover modes; explicit submission window, 1-31 days.
        type: number
        default: 7
        required: false
      institution_names:
        description: Only for institutions mode; 1-5 names, one per line. Uses DeepSeek, never emails.
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: daily-arxiv-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Validate configuration
        run: uv run --locked --no-dev arxiv-digest check
      - name: Restore state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev python .github/scripts/state.py load
      - name: Run digest or resolve delivery
        id: process
        env:
          RUN_MODE: ${{ inputs.mode || 'send' }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
          PAPER_IDS: ${{ inputs.paper_ids }}
          INSTITUTION_NAMES: ${{ inputs.institution_names }}
          RECOVERY_DAYS: ${{ inputs.recovery_days || 7 }}
          AUTO_DAILY: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DECISION_API_KEY: ${{ secrets.DECISION_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$RUN_MODE" in
            preview) uv run --locked --no-dev arxiv-digest run --dry-run ;;
            send|daily)
              if [ "$AUTO_DAILY" = 'true' ]; then
                uv run --locked --no-dev arxiv-digest run --persist-outbox --daily-after 10:00
              else
                uv run --locked --no-dev arxiv-digest run --persist-outbox
              fi
              ;;
            delivery_test) uv run --locked --no-dev arxiv-digest test-email --persist-outbox ;;
            recover_preview) uv run --locked --no-dev arxiv-digest run --dry-run --recovery-days "$RECOVERY_DAYS" ;;
            recover_send) uv run --locked --no-dev arxiv-digest run --persist-outbox --recovery-days "$RECOVERY_DAYS" ;;
            reset_checkpoints) uv run --locked --no-dev arxiv-digest reset-checkpoints ;;
            inspect)
              read -r -a PAPER_ID_ARGS <<< "$PAPER_IDS"
              uv run --locked --no-dev arxiv-digest inspect --refresh "${PAPER_ID_ARGS[@]}"
              ;;
            institutions)
              mapfile -t INSTITUTION_ARGS <<< "$INSTITUTION_NAMES"
              uv run --locked --no-dev arxiv-digest institutions --assess "${INSTITUTION_ARGS[@]}"
              ;;
            resolve_sent) uv run --locked --no-dev arxiv-digest resolve "$DELIVERY_ID" --outcome sent ;;
            resolve_retry) uv run --locked --no-dev arxiv-digest resolve "$DELIVERY_ID" --outcome retry ;;
            *) exit 2 ;;
          esac
      - name: Persist state even after a processing failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run --locked --no-dev python .github/scripts/state.py save
      - name: Upload reports and recovery database
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            .state/digest.sqlite3
            .state/institutions.json
            .state/delivery-status.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish run health and API usage
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: uv run --locked --no-dev arxiv-digest status
      - name: Notify configured recipients after a send-mode failure
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.mode == 'daily' || inputs.mode == 'send' || inputs.mode == 'recover_send') }}
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run --locked --no-dev arxiv-digest notify-failure --run-url "$RUN_URL"
