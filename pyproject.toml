[project]
name = "arxiv-jev-digest"
version = "0.1.0"
description = "Daily arXiv screening with Jev, DeepSeek summaries, and email delivery"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<7",
  "tzdata>=2025.2",
  "fonttools>=4,<5",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
